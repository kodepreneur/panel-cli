server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/vps-panel/public;
    index index.html index.php;

    charset utf-8;
    client_max_body_size 100M;

    # Frontend Single-Page Application (React/Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Control Plane REST API (Laravel)
    location /api/ {
        root /var/www/vps-panel/panel/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/vps-panel/panel/public$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }
    }

    # Model Context Protocol (MCP) SSE Stream Proxy
    location /api/v1/mcp/ {
        proxy_pass http://127.0.0.1:8089/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # ACME Challenge for Automated SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    access_log /var/log/nginx/vps-panel_access.log;
    error_log /var/log/nginx/vps-panel_error.log error;
}

